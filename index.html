<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>insight documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="insight documentation — lightweight by design" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css" />
  <style>
    .sidebar {
      display: flex !important;
      flex-direction: column !important;
      background-color: var(--sidebar-background) !important;
    }

    .app-name {
      order: 1 !important;
      margin-top: 20px !important;
      font-weight: 700 !important;
      font-size: 1.4rem !important;
    }

    .search {
      order: 2 !important;
      margin-bottom: 18px !important;
    }

    .sidebar-nav {
      order: 3 !important;
      flex: 1 !important;
    }

    #docsify-darklight-theme {
      top: 15px !important;
      right: 15px !important;
      width: 28px !important;
      height: 28px !important;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.25) !important;
    }

    .search input {
      background-color: var(--codeBackgroundColor) !important;
      border: 1px solid var(--borderColor) !important;
      color: var(--textColor) !important;
      border-radius: 4px !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading insight documentation...</div>
  <script>
    window.$docsify = {
      name: 'insight',
      repo: 'https://github.com/KpihX/insight-presentation',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      themeColor: '#1e8a63',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search insight docs...',
        noData: 'No matching page found.',
        depth: 6
      },
      darklightTheme: {
        siteFont: 'Segoe UI, Tahoma, Geneva, Verdana, sans-serif',
        defaultTheme: 'light',
        codeFontFamily: 'Consolas, Monaco, "Andale Mono", "Ubuntu Mono", monospace',
        bodyFontSize: '16px',
        light: {
          accent: '#1e8a63',
          background: '#ffffff',
          sidebarBackground: '#f5f3ef',
          textColor: '#2d2a26',
          codeTextColor: '#1f2937',
          codeBackgroundColor: '#ffffff',
          borderColor: 'rgba(45,42,38,.12)',
          blockQuoteColor: '#7a6a58',
          highlightColor: '#eef7f3',
          sidebarSubColor: '#6b7280',
          codeTypeColor: '#1e8a63',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/moon.svg)'
        },
        dark: {
          accent: '#6fd3aa',
          background: '#1c1b19',
          sidebarBackground: '#242320',
          textColor: '#ece7de',
          codeTextColor: '#f6d89b',
          codeBackgroundColor: '#34322d',
          borderColor: '#34322d',
          blockQuoteColor: '#94c973',
          highlightColor: '#2b3d36',
          sidebarSubColor: '#d7d0c4',
          codeTypeColor: '#6fd3aa',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/sun.svg)'
        }
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
